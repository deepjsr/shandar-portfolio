version: "2"
type: frontend
tech_stack:
  - React
  - Vite
  - Tailwind CSS
  - Framer Motion
routes:
  - path: /
    file: src/App.jsx
    auth_required: false
    description: Portfolio main page
features:
  - name: Navigation
    description: Navigate to different sections of the portfolio (Home, About, Projects, Contact)
    files:
      - src/components/Navbar.jsx
      - src/components/MobileMenue.jsx
    entry_route: /
    user_interactions:
      - Click on navigation links
      - Scroll through sections
    auth_required: false
  - name: Contact Form
    description: Submit a message through the contact form using Web3Forms
    files:
      - src/components/sections/Contact.jsx
    entry_route: /
    user_interactions:
      - Fill name input field
      - Fill email input field
      - Fill message textarea
      - Click Send Message button to submit
      - See success or error toast notification
    api_calls:
      - method: POST
        endpoint: https://api.web3forms.com/submit
    auth_required: false
known_limitations: []
